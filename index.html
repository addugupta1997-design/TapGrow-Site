    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "TapGrow",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "All",
      "description": "Free, transparent marketing assessment and step-by-step action planner for independent shops, clinics, restaurants, and home service providers.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('local-business-growth-planner-theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = stored === 'dark' || (stored !== 'light' && prefersDark) ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'dark') document.documentElement.classList.add('dark');
          else document.documentElement.classList.remove('dark');
        } catch (e) {}
      })();
    </script>
